<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Hopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeaff; --ink:#1f1638; --muted:#5d5480; --panel:rgba(255,255,255,.92); --line:rgba(31,22,56,.14);
  --accent:#7b3ff2; --accent-ink:#ffffff; --btn:rgba(255,255,255,.7);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f0b1c;--ink:#f2edff;--muted:#b4a9d8;--panel:rgba(26,20,44,.92);--line:rgba(255,255,255,.16);--accent:#a57cff;--accent-ink:#140e24;--btn:rgba(30,22,52,.7);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f0b1c;--ink:#f2edff;--muted:#b4a9d8;--panel:rgba(26,20,44,.92);--line:rgba(255,255,255,.16);--accent:#a57cff;--accent-ink:#140e24;--btn:rgba(30,22,52,.7);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,'Segoe UI Rounded','Segoe UI',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:2}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#wname{font-weight:700;font-size:16px;line-height:1.2}
.counts{font-size:14px;color:var(--muted);display:flex;gap:12px;margin-top:2px}
.hud-btns{display:flex;gap:8px}
.icon-btn{pointer-events:auto;min-width:46px;height:46px;padding:0 14px;border-radius:23px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 15px/1 inherit;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
.icon-btn:focus-visible,.ctl:focus-visible,.opt:focus-visible,.big:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.controls{position:absolute;left:0;right:0;bottom:16px;display:none;justify-content:space-between;align-items:flex-end;padding:0 16px;pointer-events:none;z-index:2}
@media (pointer:coarse){.controls{display:flex}.hint{display:none}}
.pad{display:flex;gap:12px}
.ctl{pointer-events:auto;width:74px;height:74px;border-radius:50%;background:var(--btn);border:2px solid var(--line);color:var(--ink);font-size:28px;font-family:inherit;display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none}
.ctl.on{background:var(--accent);color:var(--accent-ink)}
.ctl.jump{width:92px;height:92px;font-size:18px;font-weight:700}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 14px;font-size:14px;color:var(--muted);white-space:nowrap;z-index:2}
.toast{position:absolute;top:24%;left:50%;transform:translate(-50%,-50%) scale(.9);font-size:clamp(28px,6.5vw,56px);font-weight:700;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.45);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;text-align:center;z-index:3;width:90%}
.toast small{display:block;font-size:.4em;font-weight:500;margin-top:6px}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,6,24,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:5;padding:16px}
.overlay[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px;width:min(440px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);touch-action:pan-y}
.title{font-size:44px;font-weight:700;margin:0 0 6px;line-height:1;background:linear-gradient(90deg,#ff7a1a,#c13dff,#3d7bff,#38d9f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin:0 0 18px;color:var(--muted);font-size:17px;line-height:1.45}
.big{width:100%;border:0;border-radius:16px;padding:16px;background:var(--accent);color:var(--accent-ink);font:700 20px inherit;font-family:inherit;cursor:pointer}
.ward-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ward-head h2{margin:0;font-size:24px}
#prev{display:block;width:140px;height:140px;margin:4px auto 8px;border-radius:50%;background:radial-gradient(circle,#ffffff22,#00000010)}
.card h3{margin:14px 0 8px;font-size:15px;color:var(--muted);font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.sw.sel{border-color:var(--ink)}
.opt{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:9px 13px;font:500 15px inherit;font-family:inherit;cursor:pointer}
.opt.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.done{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 18px;font:700 16px inherit;font-family:inherit;cursor:pointer}
@media (max-width:420px){.ctl{width:64px;height:64px}.ctl.jump{width:82px;height:82px}.icon-btn span{display:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Portal Hopper game"></canvas>

  <div class="hud">
    <div class="pill">
      <div id="wname">Portal Plaza</div>
      <div class="counts"><span id="wcount">⭐ 0/10</span><span id="total">🏆 0/41</span></div>
    </div>
    <div class="hud-btns">
      <button class="icon-btn" id="wardBtn" aria-label="Change your character">👕<span>Style</span></button>
      <button class="icon-btn" id="muteBtn" aria-label="Mute music">🔊</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="hint">← → or A/D to move · Space to jump · walk into a portal to teleport</div>

  <div class="controls">
    <div class="pad">
      <button class="ctl" id="bL" aria-label="Move left">◀</button>
      <button class="ctl" id="bR" aria-label="Move right">▶</button>
    </div>
    <button class="ctl jump" id="bJ" aria-label="Jump">Jump</button>
  </div>

  <div class="overlay" id="start">
    <div class="card">
      <h1 class="title">Portal Hopper</h1>
      <p>Hop through portals to spooky, spacey and frosty worlds. Ride the giant slides, dress up your hopper, and find every hidden treat.</p>
      <button class="big" id="playBtn">Tap to play</button>
    </div>
  </div>

  <div class="overlay" id="ward" hidden>
    <div class="card">
      <div class="ward-head"><h2>Style your hopper</h2><button class="done" id="wardDone">Done</button></div>
      <canvas id="prev" width="280" height="280"></canvas>
      <h3>Color</h3><div class="opts" id="colors"></div>
      <h3>Hat</h3><div class="opts" id="hats"></div>
      <h3>Trail</h3><div class="opts" id="trails"></div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const LH=540, GY=460, TAU=Math.PI*2;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let scale=1, viewW=960, viewH=540, offY=0;
function resize(){
  const r=cv.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  scale=Math.min(cv.height/LH, cv.width/620);
  viewW=cv.width/scale; viewH=cv.height/scale; offY=(viewH-LH)*0.55;
}
addEventListener('resize',resize); resize();

// ---------- helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mod=(a,m)=>((a%m)+m)%m;
const hash=i=>{const s=Math.sin(i*127.1+11.7)*43758.5453;return s-Math.floor(s);};
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function hexA(h,a){const [r,g,b]=hexRgb(h);return `rgba(${r},${g},${b},${a})`;}
function shade(h,amt){let [r,g,b]=hexRgb(h);const f=v=>Math.round(amt<0?v*(1+amt):v+(255-v)*amt);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function seeded(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
const R=seeded(424242);
const STARS=Array.from({length:150},()=>({x:R()*2000,y:R()*720,s:R()*1.7+.4,p:R()*6}));
const FLAKES=Array.from({length:80},()=>({x:R(),y:R(),s:R()*2.4+1,sp:30+R()*50,p:R()*6}));

// ---------- character ----------
const COLORS=['#ff5d8f','#7b3ff2','#2bb3ff','#2ed47a','#ffb020','#ff6a2b','#f4f4f4','#3a3550'];
const HATS=[['none','None'],['witch','Witch hat'],['pumpkin','Pumpkin'],['crown','Crown'],['cat','Cat ears'],['prop','Propeller'],['astro','Space helmet']];
const TRAILS=[['none','None'],['sparkle','Sparkles'],['bubbles','Bubbles'],['ghost','Ghost fire']];
let look={color:'#ff5d8f',hat:'witch',trail:'sparkle'};
try{const s=JSON.parse(localStorage.getItem('portal-hopper-look')||'null');if(s&&s.color)look=Object.assign(look,s);}catch(e){}
function saveLook(){try{localStorage.setItem('portal-hopper-look',JSON.stringify(look));}catch(e){}}

function drawPlayer(c,x,y,lk,t,face,sq,run){
  const w=36,h=46;
  c.save(); c.translate(x,y); c.scale(1+sq*0.55,1-sq*0.55);
  const step=run?Math.sin(t*18)*3:0;
  c.fillStyle=shade(lk.color,-0.4);
  c.beginPath();c.ellipse(-8,-3+Math.max(0,step),8,5,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(8,-3+Math.max(0,-step),8,5,0,0,TAU);c.fill();
  c.fillStyle=lk.color; rr(c,-w/2,-h,w,h-3,16); c.fill();
  c.fillStyle='rgba(255,255,255,.25)'; rr(c,-w/2+5,-h+6,9,h-22,5); c.fill();
  c.fillStyle='rgba(0,0,0,.12)'; rr(c,-w/2,-14,w,11,8); c.fill();
  const ex=face*4, blink=(mod(t,3.4)<0.12)?0.15:1;
  c.fillStyle='#fff';
  c.beginPath();c.ellipse(-7+ex,-h+18,6,6.5*blink,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(7+ex,-h+18,6,6.5*blink,0,0,TAU);c.fill();
  c.fillStyle='#1d1430';
  c.beginPath();c.ellipse(-7+ex+face*2,-h+18,3,3.4*blink,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(7+ex+face*2,-h+18,3,3.4*blink,0,0,TAU);c.fill();
  c.fillStyle='rgba(255,120,150,.45)';
  circ(c,-12+ex,-h+27,3.5);c.fill();circ(c,12+ex,-h+27,3.5);c.fill();
  c.strokeStyle='#1d1430';c.lineWidth=2;c.lineCap='round';
  c.beginPath();c.arc(ex,-h+25,4,0.2,Math.PI-0.2);c.stroke();
  drawHat(c,lk.hat,-h,t,lk.color);
  c.restore();
}
function drawHat(c,hat,top,t,col){
  c.save();
  if(hat==='witch'){
    c.fillStyle='#2b1846';
    c.beginPath();c.ellipse(0,top+3,27,6,0,0,TAU);c.fill();
    c.beginPath();c.moveTo(-15,top+2);c.lineTo(15,top+2);c.quadraticCurveTo(8,top-20,18,top-38);c.quadraticCurveTo(-2,top-24,-15,top+2);c.fill();
    c.fillStyle='#ff8a1f';c.fillRect(-14,top-5,28,5);
  } else if(hat==='pumpkin'){
    c.fillStyle='#ff7a1a';
    c.beginPath();c.ellipse(-6,top-6,10,11,0,0,TAU);c.fill();
    c.beginPath();c.ellipse(6,top-6,10,11,0,0,TAU);c.fill();
    c.fillStyle='#ff9a3d';c.beginPath();c.ellipse(0,top-6,9,12,0,0,TAU);c.fill();
    c.fillStyle='#3f7a2a';c.fillRect(-2,top-22,4,7);
    c.fillStyle='#2a1200';
    c.beginPath();c.moveTo(-7,top-8);c.lineTo(-3,top-8);c.lineTo(-5,top-12);c.fill();
    c.beginPath();c.moveTo(3,top-8);c.lineTo(7,top-8);c.lineTo(5,top-12);c.fill();
  } else if(hat==='crown'){
    c.fillStyle='#ffd23d';c.strokeStyle='#d69a00';c.lineWidth=2;
    c.beginPath();c.moveTo(-14,top+3);c.lineTo(-14,top-12);c.lineTo(-7,top-4);c.lineTo(0,top-16);c.lineTo(7,top-4);c.lineTo(14,top-12);c.lineTo(14,top+3);c.closePath();c.fill();c.stroke();
    c.fillStyle='#ff3d6e';circ(c,0,top-3,2.6);c.fill();
    c.fillStyle='#3dd6ff';circ(c,-8,top-1,2);c.fill();circ(c,8,top-1,2);c.fill();
  } else if(hat==='cat'){
    for(const s of [-1,1]){
      c.fillStyle=col;c.beginPath();c.moveTo(s*16,top+8);c.lineTo(s*4,top+2);c.lineTo(s*15,top-12);c.closePath();c.fill();
      c.fillStyle='#ffb3c8';c.beginPath();c.moveTo(s*13,top+5);c.lineTo(s*7,top+3);c.lineTo(s*13,top-5);c.closePath();c.fill();
    }
  } else if(hat==='prop'){
    c.fillStyle='#2b7bff';c.beginPath();c.arc(0,top+4,15,Math.PI,0);c.fill();
    c.fillStyle='#ff3d6e';c.beginPath();c.arc(0,top+4,15,Math.PI,Math.PI*1.33);c.lineTo(0,top+4);c.fill();
    c.fillStyle='#ffd23d';c.beginPath();c.arc(0,top+4,15,Math.PI*1.66,0);c.lineTo(0,top+4);c.fill();
    c.fillStyle='#555';c.fillRect(-1.5,top-16,3,8);
    const pw=22*Math.cos(t*22);
    c.fillStyle='#ff3d6e';c.beginPath();c.ellipse(0,top-16,Math.abs(pw),3,0,0,TAU);c.fill();
  } else if(hat==='astro'){
    c.fillStyle='rgba(180,230,255,.22)';c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=3;
    circ(c,0,top+18,30);c.fill();c.stroke();
    c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=3;c.beginPath();c.arc(0,top+18,24,-2.6,-1.9);c.stroke();
    c.strokeStyle='#ccc';c.lineWidth=2;c.beginPath();c.moveTo(14,top-6);c.lineTo(20,top-20);c.stroke();
    c.fillStyle=(mod(t,1)<.5)?'#ff3d3d':'#ff9a9a';circ(c,20,top-21,3.5);c.fill();
  }
  c.restore();
}

// ---------- worlds ----------
const ground=w=>({x:-150,y:GY,w:w+300,h:600,ground:true});
const P_=(x,y,w)=>({x,y,w,h:18});
const items=a=>a.map(([x,y])=>({x,y,got:false}));
const WORLDS={
  hub:{title:'Portal Plaza',sub:'Find the portals!',w:2700,g:1800,jump:720,fric:12,speed:310,song:'hub',icon:'star',emoji:'⭐',noun:'stars',spawn:160,
    plats:[ground(2700),P_(540,400,90),P_(650,340,90),P_(540,280,90),P_(650,220,130)],
    slides:[{x1:780,y1:220,x2:1220,y2:GY,style:'rainbow'}],
    portals:[{x:1480,y:GY,to:'halloween',label:'🎃 Spooky Hollow',color:'#ff7a1a'},{x:1770,y:GY,to:'space',label:'🚀 Moon Base',color:'#3d7bff'},{x:2060,y:GY,to:'ice',label:'❄️ Frosty Peaks',color:'#38d9f5'},{x:2420,y:GY,to:'random',label:'❓ Mystery',color:'#c13dff'}],
    items:items([[585,370],[695,310],[585,250],[715,185],[880,250],[1040,338],[1340,400],[1625,330],[1915,330],[2240,380]]),
    decor:[{t:'tree',x:70},{t:'flower',x:240},{t:'sign',x:360},{t:'tree',x:470},{t:'flower',x:1290},{t:'tree',x:1340},{t:'flower',x:1630},{t:'flower',x:1910},{t:'tree',x:2240},{t:'flower',x:2560},{t:'tree',x:2640}],
    ghosts:[],theme:{ground:'#9a6a45',top:'#6fd36a',plat:'#b77a4a',platTop:'#7ee07a',dot:'rgba(0,0,0,.08)'}},
  halloween:{title:'Spooky Hollow',sub:'Collect the candy… watch out for ghosts',w:2900,g:1800,jump:720,fric:12,speed:310,song:'halloween',icon:'candy',emoji:'🍬',noun:'candy',spawn:240,
    plats:[ground(2900),P_(640,400,90),P_(760,340,90),P_(640,280,90),P_(760,220,90),P_(640,160,200)],
    slides:[{x1:840,y1:160,x2:1340,y2:GY,style:'bone'}],
    portals:[{x:140,y:GY,to:'hub',label:'🏠 Portal Plaza',color:'#38e07a'},{x:2730,y:GY,to:'space',label:'🚀 Moon Base',color:'#3d7bff'}],
    items:items([[685,370],[805,310],[685,250],[805,190],[740,125],[1000,232],[1200,353],[1550,400],[1900,300],[2250,400],[2560,330]]),
    decor:[{t:'deadtree',x:330},{t:'grave',x:450},{t:'grave',x:520},{t:'pumpkin',x:585},{t:'pumpkin',x:1440},{t:'grave',x:1700},{t:'house',x:1960},{t:'pumpkin',x:2160},{t:'pumpkin',x:2200},{t:'deadtree',x:2470},{t:'grave',x:2610},{t:'pumpkin',x:2850}],
    ghosts:[{x:1620,y:370,ph:0,cd:0},{x:2060,y:350,ph:2,cd:0},{x:2420,y:375,ph:4,cd:0}],bats:true,
    theme:{ground:'#24162f',top:'#47295c',plat:'#3d3352',platTop:'#7a6896',dot:'rgba(255,255,255,.05)'}},
  space:{title:'Moon Base',sub:'Low gravity — jump big!',w:2500,g:700,jump:500,fric:8,speed:280,song:'space',icon:'gem',emoji:'💎',noun:'gems',spawn:240,
    plats:[ground(2500),P_(480,350,120),P_(700,250,120),P_(920,160,150),P_(1800,340,110),P_(2000,240,110),P_(2190,330,110)],
    slides:[{x1:1070,y1:160,x2:1560,y2:GY,style:'neon'}],
    portals:[{x:140,y:GY,to:'hub',label:'🏠 Portal Plaza',color:'#38e07a'},{x:2400,y:GY,to:'ice',label:'❄️ Frosty Peaks',color:'#38d9f5'}],
    items:items([[540,310],[760,210],[995,120],[1200,216],[1400,338],[1855,300],[2055,195],[2245,290],[2100,110]]),
    decor:[{t:'flag',x:320},{t:'crater',x:420},{t:'rock',x:1650},{t:'crater',x:1720},{t:'rock',x:2320}],
    ghosts:[],theme:{ground:'#7f7b95',top:'#b2aec8',plat:'#4f5670',platTop:'#9fe7ff',dot:'rgba(0,0,0,.12)'}},
  ice:{title:'Frosty Peaks',sub:'Slippery! Slide all the way down',w:2600,g:1800,jump:720,fric:2.4,speed:330,song:'ice',icon:'flake',emoji:'❄️',noun:'snowflakes',spawn:240,
    plats:[ground(2600),P_(520,400,110),P_(640,340,110),P_(520,280,110),P_(640,220,110),P_(520,160,110),P_(640,100,160)],
    slides:[{x1:800,y1:100,x2:1500,y2:GY,style:'ice'}],
    portals:[{x:140,y:GY,to:'hub',label:'🏠 Portal Plaza',color:'#38e07a'},{x:2460,y:GY,to:'halloween',label:'🎃 Spooky Hollow',color:'#ff7a1a'}],
    items:items([[575,370],[695,310],[575,250],[695,190],[575,130],[720,65],[1000,180],[1300,334],[1760,400],[2000,320],[2260,400]]),
    decor:[{t:'pine',x:360},{t:'pine',x:440},{t:'snowman',x:1660},{t:'pine',x:1900},{t:'pine',x:2120},{t:'snowman',x:2330}],
    ghosts:[],theme:{ground:'#cfe9fb',top:'#ffffff',plat:'#8fcdf2',platTop:'#effcff',dot:'rgba(60,140,200,.12)'}}
};
for(const w of Object.values(WORLDS)) for(const s of w.slides) s.k=(s.y2-s.y1)/(s.x2-s.x1);

// ---------- audio ----------
let AC=null, master=null, musGain=null, noiseBuf=null, muted=false, step=0, nextT=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SONGS={
  hub:{bpm:120,root:60,chords:[[0,4,7],[5,9,12],[7,11,14],[-3,0,4]],pat:[0,1,2,3,2,1,4,2],wave:'square',vol:.045,cut:2600,arpDur:.18,bass:[0,3,4,6],bassWave:'triangle',kick:[0,4],hat:[2,6]},
  halloween:{bpm:104,root:57,chords:[[0,3,7],[-4,0,3],[5,8,12],[-5,-1,2]],pat:[0,2,1,2,3,2,1,2],wave:'sawtooth',vol:.055,cut:1100,arpDur:.26,bass:[0,3,6],bassWave:'sawtooth',kick:[0,4],hat:[2,6],spook:true},
  space:{bpm:80,root:62,chords:[[0,4,7,11],[5,9,12,16],[2,5,9,12],[7,11,14,17]],pat:[0,2,3,4,-1,3,2,1],wave:'sine',vol:.08,cut:0,arpDur:.7,bass:[0],bassWave:'sine',bassDur:1.4,kick:[],hat:[4],hatVol:.025},
  ice:{bpm:112,root:64,chords:[[0,4,7],[-3,0,4],[5,9,12],[7,11,14]],pat:[4,2,3,1,4,2,0,2],oct:1,wave:'triangle',vol:.06,cut:0,arpDur:.3,bass:[0,4],bassWave:'triangle',kick:[0],hat:[2,4,6]}

function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:0.6;master.connect(AC.destination);
  musGain=AC.createGain();musGain.gain.value=0.55;musGain.connect(master);
  const dl=AC.createDelay();dl.delayTime.value=0.28;const fb=AC.createGain();fb.gain.value=0.3;const wet=AC.createGain();wet.gain.value=0.22;
  musGain.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
  noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.3),AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  nextT=AC.currentTime+0.1; setInterval(sched,25);
}
function tone(f,t,d,type,v,dest,cut){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  let node=o; if(cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);node=fl;}
  node.connect(g);g.connect(dest);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.start(t);o.stop(t+d+0.05);return o;
}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.15);g.gain.setValueAtTime(0.32,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g);g.connect(musGain);o.start(t);o.stop(t+0.22);}
function hat(t,v){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);s.connect(f);f.connect(g);g.connect(musGain);s.start(t);s.stop(t+0.06);}
function playStep(s,time){
  const S=SONGS[W.song], i=s%8, bar=Math.floor(s/8)%S.chords.length, ch=S.chords[bar];
  const idx=S.pat[i];
  if(idx>=0){const n=S.root+ch[idx%ch.length]+12*Math.floor(idx/ch.length)+12*(S.oct||0);tone(mtof(n),time,S.arpDur,S.wave,S.vol,musGain,S.cut);}
  if(S.bass.includes(i))tone(mtof(S.root+ch[0]-24),time,S.bassDur||0.32,S.bassWave,0.2,musGain,700);
  if(S.kick.includes(i))kick(time);
  if(S.hat.includes(i))hat(time,S.hatVol||0.05);
  if(S.spook&&i===0&&bar%2===1){const o=tone(mtof(S.root+24+ch[2]),time,1.4,'sine',0.05,musGain);o.frequency.linearRampToValueAtTime(mtof(S.root+23+ch[2]),time+1.3);}
}
function sched(){
  if(!AC)return;
  if(nextT<AC.currentTime-0.2)nextT=AC.currentTime+0.05;
  while(nextT<AC.currentTime+0.12){playStep(step,nextT);nextT+=60/SONGS[W.song].bpm/2;step++;}
}
function sfx(kind){
  if(!AC)return; const t=AC.currentTime;
  if(kind==='jump'){const o=tone(420,t,0.15,'square',0.06,master,3000);o.frequency.exponentialRampToValueAtTime(820,t+0.12);}
  else if(kind==='collect'){tone(988,t,0.12,'triangle',0.12,master);tone(1319,t+0.07,0.2,'triangle',0.12,master);}
  else if(kind==='tp'){const o=tone(180,t,0.85,'sine',0.18,master);o.frequency.exponentialRampToValueAtTime(1500,t+0.7);const o2=tone(240,t,0.85,'triangle',0.08,master);o2.frequency.exponentialRampToValueAtTime(2000,t+0.7);}
  else if(kind==='boo'){const o=tone(320,t,0.55,'sawtooth',0.08,master,900);o.frequency.exponentialRampToValueAtTime(80,t+0.5);}
  else if(kind==='win'){[0,4,7,12].forEach((n,i)=>tone(mtof(72+n),t+i*0.09,0.3,'triangle',0.12,master));}
}

function addP(o){particles.push(Object.assign({vx:0,vy:0,g:0,life:.6,max:.6,size:3,kind:'dot',col:'#fff'},o));if(particles.length>400)particles.shift();}
function burst(x,y,cols,n=14,spd=220){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.4+Math.random()*.8);addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:300,life:.7,max:.7,size:2+Math.random()*3,kind:'star',col:cols[i%cols.length]});}}

  const x=P.x-P.face*10+(Math.random()-.5)*10,y=P.y-10-Math.random()*25;
  if(look.trail==='sparkle')addP({x,y,vy:-20,life:.6,max:.6,size:2+Math.random()*2.5,kind:'star',col:['#fff6a8','#ffffff',look.color][Math.floor(Math.random()*3)]});

// ---------- teleport ----------
function startTeleport(p){
  let to=p.to;
  if(to==='random'){const opts=['halloween','space','ice'].filter(w=>w!==worldId);to=opts[Math.floor(Math.random()*opts.length)];}
  trans={t:0,to,from:worldId,color:p.color,swapped:false}; P.vx=0;P.vy=0; sfx('tp');
  burst(p.x,p.y-60,[p.color,'#ffffff'],24,300);
}
function loadWorld(id,from){
  worldId=id; W=WORLDS[id];
  const back=W.portals.find(q=>q.to===from);
  if(back){P.x=back.x+(back.x>W.w/2?-90:90);P.y=back.y;}else{P.x=W.spawn;P.y=GY;}
  P.vx=0;P.vy=0;P.slide=null;P.onG=true;particles=[];texts=[];
  camX=clamp(P.x-viewW/2,0,Math.max(0,W.w-viewW));
  updateHud(); toast(`${W.title}<small>${W.sub}</small>`);

// ---------- update ----------
function ghostPos(g){return [g.x+Math.sin(T*0.7+g.ph)*110, g.y+Math.sin(T*2.2+g.ph)*16];}
function update(dt){
  tpCd-=dt;
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
  for(const tx of texts){tx.y-=40*dt;tx.life-=dt;} texts=texts.filter(t=>t.life>0);
  if(trans){
    trans.t+=dt/0.9;
    if(trans.t>=0.5&&!trans.swapped){trans.swapped=true;loadWorld(trans.to,trans.from);}
    if(trans.t>=1){trans=null;tpCd=0.8;}
    return;
  }
  const g=W.g, dir=(keys.r?1:0)-(keys.l?1:0);
  if(dir)P.face=dir;
  if(P.slide){P.vx+=P.slide.k*g*0.85*dt+dir*260*dt;P.vx=clamp(P.vx,-950,950);}
  else if(dir)P.vx+=(dir*W.speed-P.vx)*Math.min(1,(P.onG?W.fric:4)*dt);
  else if(P.onG)P.vx-=P.vx*Math.min(1,W.fric*dt);
  else P.vx-=P.vx*Math.min(1,1.2*dt);
  P.coy=(P.onG||P.slide)?0.1:P.coy-dt; P.buf-=dt;
  if(P.buf>0&&P.coy>0){P.vy=-W.jump;P.buf=0;P.coy=0;P.onG=false;P.slide=null;P.sq=-0.22;sfx('jump');
    for(let i=0;i<6;i++)addP({x:P.x+(Math.random()-.5)*20,y:P.y,vx:(Math.random()-.5)*120,vy:-Math.random()*60,life:.4,max:.4,size:3,col:'rgba(255,255,255,.7)'});}
  if(!keys.j&&P.vy<0)P.vy+=g*1.1*dt;
  P.vy=Math.min(P.vy+g*dt,1300);
  const prevB=P.y, was=P.slide;
  P.x+=P.vx*dt; P.y+=P.vy*dt;
  if(P.x<20){P.x=20;P.vx=0;} if(P.x>W.w-20){P.x=W.w-20;P.vx=0;}
  P.onG=false; P.slide=null;
  const hw=P.w/2-6;
  for(const p of W.plats){
    if(P.vy>=0&&P.x+hw>p.x&&P.x-hw<p.x+p.w&&prevB<=p.y+1&&P.y>=p.y){
      if(P.vy>520){P.sq=Math.min(.32,P.vy/2600);for(let i=0;i<5;i++)addP({x:P.x+(Math.random()-.5)*24,y:p.y,vx:(Math.random()-.5)*140,vy:-Math.random()*50,life:.35,max:.35,size:3,col:'rgba(255,255,255,.6)'});}
      P.y=p.y;P.vy=0;P.onG=true;
    }
  }
  if(!P.onG&&P.vy>=0){
    for(const s of W.slides){
      if(P.x<s.x1||P.x>s.x2)continue;
      const ly=s.y1+s.k*(P.x-s.x1);
      if((P.y>=ly&&prevB<=ly+14)||(was===s&&P.y<ly&&ly-P.y<38)){P.y=ly;P.vy=0;P.slide=s;break;}
    }
  }
  if(P.slide&&Math.random()<0.7)addP({x:P.x-P.face*14,y:P.y-2,vx:-P.vx*0.1,vy:-30-Math.random()*40,life:.4,max:.4,size:2.5,kind:'star',col:['#ffffff','#fff3a0',look.color][Math.floor(Math.random()*3)]});
  P.sq*=Math.pow(0.0009,dt);
  if(look.trail!=='none'&&(Math.abs(P.vx)>60||!P.onG)&&Math.random()<0.55)trail();

  // items
  const pcy=P.y-23;
  for(const it of W.items){
    if(it.got)continue;
    if(Math.hypot(P.x-it.x,pcy-it.y)<34){
      it.got=true;sfx('collect');burst(it.x,it.y,['#ffd23d','#ffffff','#ff5d8f','#5ef0ff'],16);
      texts.push({x:it.x,y:it.y-20,txt:'+1',life:.9});updateHud();
      if(W.items.every(i=>i.got)){sfx('win');setTimeout(()=>toast(`All ${W.noun} found! 🎉`),300);}
    }
  }
  // ghosts
  for(const gh of W.ghosts){
    gh.cd-=dt;const [gx,gy]=ghostPos(gh);
    if(gh.cd<=0&&Math.abs(P.x-gx)<36&&Math.abs(pcy-gy)<40){
      gh.cd=1.2;const s=P.x<gx?-1:1;P.vx=s*460;P.vy=-480;P.slide=null;P.onG=false;sfx('boo');
      texts.push({x:gx,y:gy-40,txt:'BOO!',life:1,big:true});
    }
  }
  // portals
  if(tpCd<=0){
    for(const p of W.portals){
      if(Math.abs(P.x-p.x)<26&&Math.abs(pcy-(p.y-60))<55){startTeleport(p);break;}
    }
  }
  const target=P.x-viewW/2+P.vx*0.25;
  camX+=(target-camX)*Math.min(1,6*dt);
  camX=clamp(camX,0,Math.max(0,W.w-viewW));
}

function render(t){

  ctx.setTransform(scale,0,0,scale,-camX*scale,offY*scale);
  const th=W.theme,L=camX-200,Rr=camX+viewW+200;
  for(const d of W.decor)if(d.x>L-200&&d.x<Rr+200)drawDecor(ctx,d,t);

  // ground
  ctx.fillStyle=th.ground;ctx.fillRect(L,GY,Rr-L,700);
  ctx.fillStyle=th.top;ctx.fillRect(L,GY,Rr-L,10);
  ctx.fillStyle=th.dot;for(let x=Math.floor(L/60)*60;x<Rr;x+=60){circ(ctx,x+hash(x)*30,GY+30+hash(x+1)*40,3+hash(x+2)*4);ctx.fill();}

  for(const s of W.slides)drawSlide(ctx,s,t);
  for(const p of W.portals)drawPortal(ctx,p,t);
  for(const it of W.items)if(!it.got)drawItem(ctx,W.icon,it.x,it.y,t);
  for(const gh of W.ghosts){const [gx,gy]=ghostPos(gh);drawGhost(ctx,gx,gy,t,gh.ph);}
  for(const p of particles)drawParticle(ctx,p);
  if(P.onG||P.slide){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(P.x,P.y+1,18,4,0,0,TAU);ctx.fill();}
  drawPlayer(ctx,P.x,P.y,look,t,P.face,P.sq,P.onG&&Math.abs(P.vx)>40);
  ctx.textAlign='center';
  for(const tx of texts){ctx.globalAlpha=Math.min(1,tx.life*2);ctx.font=`700 ${tx.big?30:20}px Fredoka, sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.strokeText(tx.txt,tx.x,tx.y);ctx.fillStyle=tx.big?'#e9e2ff':'#fff';ctx.fillText(tx.txt,tx.x,tx.y);ctx.globalAlpha=1;}
  ctx.setTransform(scale,0,0,scale,0,0);
  if(FG[worldId])FG[worldId](ctx,camX,t,offY);
  if(trans){
    const tt=trans.t,k=tt<0.5?1-tt*2:(tt-0.5)*2,e=k*k*(3-2*k);
    const maxR=Math.hypot(viewW,viewH),r=Math.max(0.5,maxR*e);
    const sx=P.x-camX,sy=P.y-28+offY;
    ctx.beginPath();ctx.rect(0,0,viewW,viewH);ctx.arc(sx,sy,r,0,TAU);
    ctx.fillStyle=shade(trans.color,-0.7);ctx.fill('evenodd');
    ctx.strokeStyle=hexA(trans.color,0.9);ctx.lineWidth=6;circ(ctx,sx,sy,r);ctx.stroke();
    for(let i=0;i<10;i++){const a=t*6+i*TAU/10,rad=r+14+Math.sin(t*10+i)*6;ctx.fillStyle='#fff';circ(ctx,sx+Math.cos(a)*rad,sy+Math.sin(a)*rad,2.5);ctx.fill();}
  }
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;T+=dt;
  if(playing&&!wardOpen)update(dt);
  render(T);
  if(wardOpen)drawPreview(T);
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
})();
</script>
